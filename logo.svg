<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Arki Chat">
  <title>Arki Chat</title>
  <defs>
    <linearGradient id="arkiBody" x1="6" y1="13" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9BD8FF"/>
      <stop offset=".45" stop-color="#45A5FF"/>
      <stop offset="1" stop-color="#1B6FD0"/>
    </linearGradient>
  </defs>
  <!-- the same little geometric fringe the character has, in the same pill language.
       the body spans x 4..60, so the strands are centred on x=32 and hide their bases
       behind it (tips y 3..7, bodies running down into the bubble) -->
  <g fill="#33343C">
    <rect x="16.4" y="7" width="5.2" height="16" rx="2.6" transform="rotate(-18 19 7)"/>
    <rect x="22.2" y="4" width="5.6" height="19" rx="2.8" transform="rotate(-10 25 4)"/>
    <rect x="29" y="3" width="6" height="21" rx="3"/>
    <rect x="36.2" y="4" width="5.6" height="19" rx="2.8" transform="rotate(9 39 4)"/>
    <rect x="42.4" y="7" width="5.2" height="16" rx="2.6" transform="rotate(18 45 7)"/>
  </g>
  <g fill="url(#arkiBody)">
    <!-- the squircle body, plus a curved chat tail tucked under the corner -->
    <rect x="4" y="12" width="56" height="41" rx="16"/>
    <path d="M21 47c-3 5.2-5.6 10-7.5 15 6.2-1.8 12.8-5 18.5-9.9z"/>
  </g>
  <ellipse cx="22" cy="21" rx="12" ry="5.5" fill="#fff" opacity=".14"/>
  <!-- the two pill eyes that make Arki Arki -->
  <g fill="#17181D" class="eyes">
    <rect x="18.5" y="23" width="9" height="19" rx="4.5"/>
    <rect x="36.5" y="23" width="9" height="19" rx="4.5"/>
  </g>
</svg>